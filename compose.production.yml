name: qiaoshen

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - backend

  app:
    image: ${APP_IMAGE:-qiaoshen-app:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      APP_RELEASE: ${APP_RELEASE:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_storage:/app/.storage
      - ./backups:/backups
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - frontend
      - backend

  backup:
    image: ${APP_IMAGE:-qiaoshen-app:local}
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "sh",
        "-c",
        "while true; do node scripts/backup-production.mjs; sleep 86400; done",
      ]
    volumes:
      - app_storage:/app/.storage:ro
      - ./backups:/backups
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend

volumes:
  postgres_data:
  app_storage:
  caddy_data:
  caddy_config:

networks:
  frontend:
  backend:
    internal: true
